[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaseflag-sdk"
version = "0.1.0"
description = "Python SDK for the Phase Flag feature flag platform"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Phase Flag", email = "support@phaseflag.io" },
]
keywords = ["feature-flags", "phaseflag", "phase-flag", "sdk", "feature-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.20",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://phaseflag.io"
Documentation = "https://docs.phaseflag.dev/sdks/python"
Repository = "https://github.com/phaseflag/phaseflag"
"Bug Tracker" = "https://github.com/phaseflag/phaseflag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/phaseflag"]
