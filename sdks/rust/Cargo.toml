[package]
name = "phaseflag"
version = "0.1.0"
edition = "2021"
description = "Phase Flag Rust SDK for feature flag evaluation with local caching, targeting rules, and event tracking."
license = "MIT"
repository = "https://github.com/phaseflag/sdk-rust"
keywords = ["feature-flags", "phaseflag", "sdk"]
categories = ["web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
parking_lot = "0.12"
