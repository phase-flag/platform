x-restart: &restart
  restart: unless-stopped

services:
  # ─── Database ────────────────────────────────────────────────────────────────
  db:
    <<: *restart
    image: postgres:16-alpine
    ports:
      - "5433:5432"           # 5433 on host to avoid conflicts with local postgres
    environment:
      POSTGRES_USER: phaseflag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: phaseflag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phaseflag -d phaseflag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    <<: *restart
    build:
      context: ./core/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PHASEFLAG_DATABASE_URL=postgresql+asyncpg://phaseflag:${DB_PASSWORD}@db:5432/phaseflag
      - PHASEFLAG_JWT_SECRET_KEY=${JWT_SECRET}
      - PHASEFLAG_API_SECRET_KEY=${API_SECRET}
      - PHASEFLAG_CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5174,http://localhost:5175}
      - PHASEFLAG_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PHASEFLAG_DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-oss}
      - PHASEFLAG_STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - PHASEFLAG_STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PHASEFLAG_STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - PHASEFLAG_STRIPE_ENTERPRISE_PRICE_ID=${STRIPE_ENTERPRISE_PRICE_ID:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Relay ───────────────────────────────────────────────────────────────────
  relay:
    <<: *restart
    build:
      context: ./core/relay
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PHASEFLAG_RELAY_UPSTREAM=http://api:8000
      - PHASEFLAG_RELAY_API_KEY=${RELAY_API_KEY:-}
      - PHASEFLAG_RELAY_LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      api:
        condition: service_healthy

  # ─── Dashboard (admin UI) ─────────────────────────────────────────────────────
  dashboard:
    <<: *restart
    build:
      context: ./core/dashboard
      dockerfile: Dockerfile
      args:
        # Relative path — requests go through nginx gateway at :80
        # For direct access at :3000, set to http://localhost:8000/api/v1
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ─── Portal (SaaS customer portal) ───────────────────────────────────────────
  portal:
    <<: *restart
    build:
      context: ./portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_healthy

  # ─── Marketing site ───────────────────────────────────────────────────────────
  marketing:
    <<: *restart
    build:
      context: ./marketing
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "5175:5175"

  # ─── Gateway (nginx reverse proxy at :80) ─────────────────────────────────────
  # Routes /api/v1/* → API, / → Dashboard, /portal → Portal, /marketing → Marketing
  gateway:
    <<: *restart
    build:
      context: ./infra/docker/gateway
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
      - dashboard
      - portal
      - marketing

volumes:
  pgdata:
