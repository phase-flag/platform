[tool.poetry]
name = "phaseflag-api"
version = "0.1.0"
description = "Phase Flag feature flag management API"
authors = ["Phase Flag Team"]
license = "Apache-2.0"
packages = [{include = "phaseflag_api"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {version = "^0.27.0", extras = ["standard"]}
sqlalchemy = {version = "^2.0.25", extras = ["asyncio"]}
aiosqlite = "^0.19.0"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic-settings = "^2.1.0"
pyjwt = {version = "^2.8.0", extras = ["crypto"]}
bcrypt = "^4.1.0"
email-validator = "^2.1.0"
httpx = "^0.26.0"
packaging = "^23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
httpx = "^0.26.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E712"]  # SQLAlchemy ORM filters use == True/False intentionally

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # re-exports are intentional in __init__ files
"tests/conftest.py" = ["E402"]  # late imports required for env var setup

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
