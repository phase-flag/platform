apiVersion: v1
kind: Service
metadata:
  name: {{ include "phaseflag.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "phaseflag.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "phaseflag.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
---
{{- if .Values.relay.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "phaseflag.fullname" . }}-relay
  labels:
    app.kubernetes.io/name: {{ include "phaseflag.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: relay
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.relay.port }}
      targetPort: {{ .Values.relay.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "phaseflag.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: relay
{{- end }}
---
{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "phaseflag.fullname" . }}-dashboard
  labels:
    app.kubernetes.io/name: {{ include "phaseflag.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.dashboard.port }}
      targetPort: {{ .Values.dashboard.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "phaseflag.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
{{- end }}
