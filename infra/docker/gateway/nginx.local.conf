worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream definitions
    upstream api_upstream {
        server api:8000;
    }

    upstream relay_upstream {
        server relay:8081;
    }

    upstream dashboard_upstream {
        server dashboard:3000;
    }

    upstream portal_upstream {
        server portal:5174;
    }

    upstream marketing_upstream {
        server marketing:5175;
    }

    server {
        listen 80;
        server_name _;

        # Common proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # ── API ──────────────────────────────────────────────────────────────
        location /api/v1/ {
            proxy_pass http://api_upstream/api/v1/;
        }

        location /health {
            proxy_pass http://api_upstream/health;
        }

        # Swagger UI
        location /docs {
            proxy_pass http://api_upstream/docs;
        }

        # Swagger static assets
        location /openapi.json {
            proxy_pass http://api_upstream/openapi.json;
        }

        # ── Relay ─────────────────────────────────────────────────────────────
        location /relay/ {
            proxy_pass http://relay_upstream/;
        }

        # ── Portal ────────────────────────────────────────────────────────────
        location /portal/ {
            rewrite ^/portal/(.*) /$1 break;
            proxy_pass http://portal_upstream;
        }

        location /portal {
            return 301 /portal/;
        }

        # ── Marketing ─────────────────────────────────────────────────────────
        location /marketing/ {
            rewrite ^/marketing/(.*) /$1 break;
            proxy_pass http://marketing_upstream;
        }

        location /marketing {
            return 301 /marketing/;
        }

        # ── Dashboard (catch-all) ─────────────────────────────────────────────
        location / {
            proxy_pass http://dashboard_upstream;
        }
    }
}
