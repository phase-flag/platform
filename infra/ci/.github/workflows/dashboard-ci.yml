name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - 'core/dashboard/**'
  pull_request:
    branches: [main]
    paths:
      - 'core/dashboard/**'

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: core/dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd core/dashboard
          npm ci

      - name: Run ESLint
        run: |
          cd core/dashboard
          npm run lint

      - name: Run TypeScript check
        run: |
          cd core/dashboard
          npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: core/dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd core/dashboard
          npm ci

      - name: Build
        run: |
          cd core/dashboard
          npm run build
        env:
          VITE_API_URL: https://api.phaseflag.dev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: core/dashboard/dist
          retention-days: 7
