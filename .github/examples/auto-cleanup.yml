name: Auto-Cleanup Feature Flags on Branch Merge

# Triggered when a pull request targeting main (or any release branch) is merged.
on:
  pull_request:
    types: [closed]
    branches:
      - main
      - "release/**"

jobs:
  archive-feature-flag:
    name: Archive feature flag for merged branch
    runs-on: ubuntu-latest
    # Only run when the PR was actually merged (not just closed/abandoned)
    if: github.event.pull_request.merged == true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Derive the flag key from the branch name.
      # Convention: a branch named "feature/my-feature" corresponds to a
      # flag key "my-feature". Adjust the sed transform to match your project's
      # naming convention.
      # -----------------------------------------------------------------------
      - name: Derive flag key from branch name
        id: derive-key
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          # Strip leading "feature/", "feat/", or "fix/" prefixes and replace
          # slashes + underscores with hyphens to produce a valid flag key.
          FLAG_KEY=$(echo "${BRANCH}" \
            | sed 's|^feature/||;s|^feat/||;s|^fix/||' \
            | tr '/_' '-' \
            | tr '[:upper:]' '[:lower:]')
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "flag_key=${FLAG_KEY}" >> "$GITHUB_OUTPUT"
          echo "Derived flag key: ${FLAG_KEY} (from branch: ${BRANCH})"

      # -----------------------------------------------------------------------
      # Check if the flag actually exists before trying to archive it.
      # A non-existent flag should not fail the workflow.
      # -----------------------------------------------------------------------
      - name: Check if flag exists
        id: check-flag
        continue-on-error: true
        uses: ./.github/actions/flag-check
        with:
          api-url: ${{ secrets.PHASEFLAG_API_URL }}
          api-key: ${{ secrets.PHASEFLAG_API_KEY }}
          flag-key: ${{ steps.derive-key.outputs.flag_key }}
          action: check

      # -----------------------------------------------------------------------
      # Archive the flag only if it exists (previous step succeeded).
      # -----------------------------------------------------------------------
      - name: Archive feature flag
        if: steps.check-flag.outcome == 'success'
        uses: ./.github/actions/flag-check
        with:
          api-url: ${{ secrets.PHASEFLAG_API_URL }}
          api-key: ${{ secrets.PHASEFLAG_API_KEY }}
          flag-key: ${{ steps.derive-key.outputs.flag_key }}
          action: archive

      - name: Report result
        if: steps.check-flag.outcome == 'success'
        run: |
          echo "Feature flag '${{ steps.derive-key.outputs.flag_key }}' has been archived."
          echo "Branch '${{ steps.derive-key.outputs.branch }}' was merged into ${{ github.base_ref }}."

      - name: Skip — no matching flag
        if: steps.check-flag.outcome != 'success'
        run: |
          echo "No feature flag found for key '${{ steps.derive-key.outputs.flag_key }}'."
          echo "Nothing to archive — skipping."

  # ---------------------------------------------------------------------------
  # Optional: post a summary comment on the PR
  # ---------------------------------------------------------------------------
  comment-on-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: archive-feature-flag
    if: always() && github.event.pull_request.merged == true
    permissions:
      pull-requests: write
    steps:
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.archive-feature-flag.result }}';
            const flagKey = '${{ needs.archive-feature-flag.outputs.flag_key || 'unknown' }}';
            const body = result === 'success'
              ? `Phase Flag: feature flag \`${flagKey}\` has been archived automatically.`
              : `Phase Flag: no feature flag found for key \`${flagKey}\` — nothing archived.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
