name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'core/api/**'
      - 'core/relay/**'
      - 'core/dashboard/**'

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: Build & Push API (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/phase-flag/api
          tags: |
            type=sha
            type=raw,value=dev

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: core/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  relay:
    name: Build & Push Relay (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/phase-flag/relay
          tags: |
            type=sha
            type=raw,value=dev

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: core/relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dashboard:
    name: Build & Push Dashboard (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/phase-flag/dashboard
          tags: |
            type=sha
            type=raw,value=dev

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: core/dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
