name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'core/api/**'
  pull_request:
    branches: [main]
    paths:
      - 'core/api/**'

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install poetry==1.7.1
          cd core/api
          poetry install

      - name: Run ruff linter
        run: |
          cd core/api
          poetry run ruff check .

      - name: Run ruff formatter check
        run: |
          cd core/api
          poetry run ruff format --check .

      - name: Run mypy type checking
        run: |
          cd core/api
          poetry run mypy phaseflag_api/ --ignore-missing-imports
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phaseflag
          POSTGRES_PASSWORD: phaseflag
          POSTGRES_DB: phaseflag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install poetry==1.7.1
          cd core/api
          poetry install

      - name: Run tests
        run: |
          cd core/api
          poetry run pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          PHASEFLAG_DATABASE_URL: postgresql+asyncpg://phaseflag:phaseflag@localhost:5432/phaseflag_test
          PHASEFLAG_JWT_SECRET_KEY: test-secret
          PHASEFLAG_API_SECRET_KEY: test-api-secret

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: core/api/test-results.xml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: core/api
          push: false
          tags: phaseflag/api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
