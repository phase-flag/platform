name: SDK CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
  workflow_dispatch:

jobs:
  javascript:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test
        run: |
          cd sdks/javascript
          npm ci
          npm test
          npm run build

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        run: |
          cd sdks/python
          pip install -e ".[dev]"
          pytest tests/ -v

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Test
        run: |
          cd sdks/go
          go test ./... -v -race

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Test
        run: |
          cd sdks/java
          mvn test

  dotnet:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: |
          cd sdks/dotnet
          dotnet test

  react:
    name: React SDK
    runs-on: ubuntu-latest
    needs: [javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JS SDK first (peer dependency)
        run: |
          cd sdks/javascript
          npm ci
          npm run build

      - name: Install and build React SDK
        run: |
          cd sdks/react
          npm install --legacy-peer-deps
          npm run build

  publish-js-sdk:
    name: Publish @phaseflag/js-sdk to npm
    runs-on: ubuntu-latest
    needs: [javascript]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and publish
        run: |
          cd sdks/javascript
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-react-sdk:
    name: Publish @phaseflag/react to npm
    runs-on: ubuntu-latest
    needs: [react, publish-js-sdk]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build JS SDK peer dep first
        run: |
          cd sdks/javascript
          npm ci
          npm run build

      - name: Build and publish React SDK
        run: |
          cd sdks/react
          npm install --legacy-peer-deps
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python-sdk:
    name: Publish phaseflag-sdk to PyPI
    runs-on: ubuntu-latest
    needs: [python]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and publish
        run: |
          cd sdks/python
          pip install build twine
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-go-sdk:
    name: Publish Go SDK (tag push)
    runs-on: ubuntu-latest
    needs: [go]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Verify Go SDK builds
        run: |
          cd sdks/go
          go vet ./...
          go build ./...

      - name: Tag Go module
        # Go modules are published via git tags. The tag pushed to the repo
        # (e.g. v0.1.0) makes the module available at pkg.go.dev automatically.
        # Use sdks/go/ subdirectory tagging (sdks/go/v0.x.x) for monorepo setup.
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Go module github.com/phaseflag/go-sdk published at tag: $TAG"
          echo "Available at: https://pkg.go.dev/github.com/phaseflag/go-sdk@${TAG}"
